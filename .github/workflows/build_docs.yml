name: Build documentation

env:
  CACHE_NUMBER: 1  # increase to reset cache manually

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    strategy:
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: ./
        
    steps:
      - uses: actions/checkout@v3
      
      # 1. Setup Ruby and natively cache your Jekyll bundle dependencies
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true # Automatically runs bundle install and handles caching safely

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        
      # 2. Build natively using Jekyll instead of Sphinx
      - name: Build with Jekyll
        run: |
          bundle exec jekyll build
          
      # 3. Jekyll builds to _site/ by default, upload that folder
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
